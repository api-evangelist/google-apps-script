naftiko: 1.0.0-alpha2
info:
  label: Google Apps Script API — Processes
  description: 'Google Apps Script API — Processes. 1 operations. Lead operation: Google Apps Script List Processes. Self-contained
    Naftiko capability covering one Google Apps Script business surface.'
  tags:
  - Google Apps Script
  - Processes
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GOOGLE_APPS_SCRIPT_API_KEY: GOOGLE_APPS_SCRIPT_API_KEY
capability:
  consumes:
  - type: http
    namespace: openapi-processes
    baseUri: https://script.googleapis.com
    description: Google Apps Script API — Processes business capability. Self-contained, no shared references.
    resources:
    - name: v1-processes
      path: /v1/processes
      operations:
      - name: listprocesses
        method: GET
        description: Google Apps Script List Processes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: pageSize
          in: query
          type: integer
        - name: pageToken
          in: query
          type: string
  exposes:
  - type: rest
    namespace: openapi-processes-rest
    port: 8080
    description: REST adapter for Google Apps Script API — Processes. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v1/processes
      name: v1-processes
      description: REST surface for v1-processes.
      operations:
      - method: GET
        name: listprocesses
        description: Google Apps Script List Processes
        call: openapi-processes.listprocesses
        with:
          pageSize: rest.pageSize
          pageToken: rest.pageToken
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openapi-processes-mcp
    port: 9090
    transport: http
    description: MCP adapter for Google Apps Script API — Processes. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: google-apps-script-list-processes
      description: Google Apps Script List Processes
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openapi-processes.listprocesses
      with:
        pageSize: tools.pageSize
        pageToken: tools.pageToken
      outputParameters:
      - type: object
        mapping: $.
